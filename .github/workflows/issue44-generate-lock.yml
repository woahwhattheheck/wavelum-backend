name: Finalize root npm lockfile

on:
  push:
    branches:
      - rook/issue44-dependency-standards

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rook/issue44-dependency-standards
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Generate root package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and remove generator
        run: |
          git config user.name "woahwhattheheck"
          git config user.email "293286387+woahwhattheheck@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/issue44-generate-lock.yml
          git commit -m "chore: lock root dependencies"
          git push origin HEAD:rook/issue44-dependency-standards
