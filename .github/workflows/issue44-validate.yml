name: Repair backend dependency lock

on:
  push:
    branches:
      - rook/issue44-dependency-standards

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rook/issue44-dependency-standards
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Regenerate backend package-lock.json
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synced backend lock and remove repair workflow
        run: |
          git config user.name "woahwhattheheck"
          git config user.email "293286387+woahwhattheheck@users.noreply.github.com"
          git add backend/package-lock.json
          git rm .github/workflows/issue44-validate.yml
          git commit -m "chore: sync backend dependency lock"
          git push origin HEAD:rook/issue44-dependency-standards
