name: GF42 one-time strict TypeScript compiler check

on:
  push:
    branches:
      - feat/grantfox42-strict-typescript-boundary-20261008-gpt6

permissions:
  contents: read

jobs:
  focused-tscheck:
    # Only the compiler-preflight commit triggers execution; later edits must
    # not launch repeated builds or unrelated test suites.
    if: github.event.head_commit.message == 'gf42 one-shot backend typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked backend dependencies without lifecycle scripts
        working-directory: backend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check strict TypeScript diagnostics (no emit)
        working-directory: backend
        run: npm run typecheck
