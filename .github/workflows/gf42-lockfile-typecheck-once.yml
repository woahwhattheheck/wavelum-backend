name: GF42 focused lockfile and typecheck
on:
  push:
    branches:
      - feat/grantfox42-strict-typescript-boundary-20261008-gpt6
permissions:
  contents: write
jobs:
  lockfile-and-typecheck:
    if: github.event.head_commit.message == 'gf42-tsconfig-compiler-once-6c2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: One focused strict TypeScript compiler check
        working-directory: backend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
