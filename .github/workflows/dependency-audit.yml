name: Dependency Audit

# Issue #44 — dependency management standards and lockfile validation.
# Blocking: lockfile sync (`npm ci --dry-run`) and version-range policy.
# Report-only: license/copyleft alerts, deprecation and outdated metrics.

on:
  push:
    branches: ["main", "develop", "feature/*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  dependency-audit:
    name: Lockfile sync, range policy and dependency report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # Blocking: fails when package.json and package-lock.json disagree.
      # Root lockfile is generated but pending transport (artifact-size); the
      # root gate activates automatically once package-lock.json lands.
      - name: Verify root lockfile is in sync
        if: hashFiles('package-lock.json') != ''
        run: npm ci --dry-run

      # Currently detects a real pre-existing defect on main: backend
      # package-lock.json is missing joi/winston entries already declared in
      # package.json — resync lands via PR #61 or `npm install
      # --package-lock-only`.
      - name: Verify backend lockfile is in sync
        working-directory: ./backend
        run: npm ci --dry-run

      # Blocking: exact/caret ranges only; enforced dirs must stay in sync.
      - name: Enforce dependency version-range policy
        run: node scripts/check-dependency-ranges.js

      # Report-only: license inventory, copyleft alerts, deprecations.
      # Reads lockfile metadata — no install required.
      - name: Report dependency metrics and licenses
        run: node scripts/report-dependencies.js

      # Report-only: outdated snapshot for the backend service.
      - name: Report outdated backend dependencies
        working-directory: ./backend
        run: npm outdated || true
