name: Lumina-etwork Tests

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    # Compiler-only contribution branch: do not schedule broad Jest/coverage sweeps.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'feat/grantfox42-strict-typescript-boundary-20261008-gpt6' }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Create environment file
        working-directory: ./backend
        run: cp .env.example .env
        
      - name: Create data directory
        working-directory: ./backend
        run: mkdir -p data
        
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        
      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage

      - name: Check for Soroban changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            soroban:
              - 'backend/src/services/soroban*.js'
              - 'contracts/**'

      - name: Run Soroban integration tests
        if: steps.filter.outputs.soroban == 'true'
        working-directory: ./backend
        run: npm run test:integration:soroban
