name: Lumina-etwork Tests

on:
  push:
    branches: [ "main", "develop", "feature/*" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  validate-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check required issue templates
        run: |
          set -euo pipefail
          required=(
            .github/ISSUE_TEMPLATE/bug_report.yml
            .github/ISSUE_TEMPLATE/feature_request.yml
            .github/ISSUE_TEMPLATE/technical_debt.yml
            .github/ISSUE_TEMPLATE/config.yml
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "::error file=$file::Required issue template is missing"; exit 1; }
          done

      - name: Validate issue template YAML
        run: ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path); puts "validated #{path}" }' .github/ISSUE_TEMPLATE/*.yml

  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
          
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci
        
      - name: Create environment file
        working-directory: ./backend
        run: cp .env.example .env
        
      - name: Create data directory
        working-directory: ./backend
        run: mkdir -p data
        
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        
      - name: Generate coverage report
        working-directory: ./backend
        run: npm run test:coverage

      - name: Check for Soroban changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            soroban:
              - 'backend/src/services/soroban*.js'
              - 'contracts/**'

      - name: Run Soroban integration tests
        if: steps.filter.outputs.soroban == 'true'
        working-directory: ./backend
        run: npm run test:integration:soroban
