name: Bug report
description: Report a reproducible problem in Wavelum Backend.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Wavelum Backend. Please include enough detail to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what part of the backend is affected?
      placeholder: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: node_version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v22.16.0
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      description: OS and version where the problem occurs.
      placeholder: Ubuntu 24.04, macOS 15, Windows 11
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Browser and version, if the problem involves a browser-facing surface.
      placeholder: Chrome 141 or N/A
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Attach relevant logs or screenshots. Remove sensitive data first.
      placeholder: Drag screenshots here or paste a minimal log excerpt.
