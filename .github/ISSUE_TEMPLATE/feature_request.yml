name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or limitation should this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or outcome you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds have you considered?
  - type: dropdown
    id: priority
    attributes:
      label: Impact priority
      description: How important is this request?
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
